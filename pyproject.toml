[tool.poetry]
name = "slipway"
version = "1.0.0"
description = "Slipway — Git-native Golden Paths for Platform Engineering (reference implementation)"
authors = ["Lawrence Chew <lawrence.chew@example.com>"]

# Let Poetry find the package directory
packages = [ { include = "app" } ]

[tool.poetry.dependencies]
python = "^3.13"
fastapi = "^0.97.0"
uvicorn = {extras=["standard"], version="^0.22.0"}
pydantic = "^1.10.10"
sqlalchemy = "^2.0"
alembic = "^1.11.1"
psycopg = "^3.2"
httpx = "<0.28"

[tool.poetry.dev-dependencies]
pytest = "^7.4"
# ruff removed from dev-dependencies to avoid CI resolution issues

[tool.poetry.scripts]
slipway = "app.main:run"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
