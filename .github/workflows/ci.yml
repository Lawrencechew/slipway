name: CI - Public v1

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  ci:
    name: CI (backend + frontend)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: slipway
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/slipway

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"

      - name: Install Poetry and project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry config virtualenvs.create false
          poetry install --no-interaction --no-ansi

      - name: Print key package versions
        run: |
          python - <<'PY'
          import importlib

          pkgs = ["fastapi", "starlette", "httpx", "anyio", "pytest"]

          for p in pkgs:
              try:
                  m = importlib.import_module(p)
                  print(f"{p}=={getattr(m, '__version__', m)}")
              except Exception as e:
                  print(f"{p} not installed: {e}")
          PY

      - name: Wait for Postgres to become ready
        run: |
          echo "Waiting for Postgres on 127.0.0.1:5432..."

          for i in {1..20}; do
            if pg_isready -h 127.0.0.1 -p 5432 -U postgres; then
              echo "Postgres ready"
              exit 0
            fi

            sleep 3
          done

          echo "Postgres did not become ready in time"
          exit 1

      - name: Run Alembic migrations
        run: alembic upgrade head

      - name: Run backend tests
        run: |
          timeout 180s pytest -vv --maxfail=1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install and build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build