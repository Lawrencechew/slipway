name: CI - Public v1

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  ci:
    name: CI (backend + frontend)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pavedpath
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/pavedpath
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install Poetry and project deps (use committed lockfile)
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry config virtualenvs.create false
          poetry install --no-interaction --no-ansi

      - name: Print key package versions
        run: |
          python - <<'PY'
import importlib
pkgs = ['fastapi','starlette','httpx','anyio','pytest']
for p in pkgs:
    try:
        m = importlib.import_module(p)
        print(f"{p}=={getattr(m,'__version__',m)}")
    except Exception as e:
        print(f"{p} not installed: {e}")
PY

      - name: Run Alembic migrations
        run: |
          alembic upgrade head

      - name: Run backend tests
        run: |
          pytest -q

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install and build frontend
        run: |
          cd frontend
          npm ci
          npm run build
